<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Byte</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .login-card {
            width: 380px;
            padding: 35px;
            border-radius: 15px;
            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            color: #fff;
        }

        .login-card h3 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .input-group-text {
            background: transparent;
            border: none;
            color: #fff;
        }

        .form-control {
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(255,255,255,0.5);
            color: #fff;
            border-radius: 0;
        }

        .form-control:focus {
            box-shadow: none;
            border-bottom: 2px solid #fff;
            background: transparent;
            color: #fff;
        }

        .form-control::placeholder {
            color: rgba(255,255,255,0.7);
        }

        .btn-login {
            background: #fff;
            color: #6a11cb;
            font-weight: bold;
            border-radius: 30px;
            transition: 0.3s;
        }

        .btn-login:hover {
            background: #ddd;
        }

        .toggle-password {
            cursor: pointer;
        }

        .extra-links {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .extra-links a {
            color: #fff;
            text-decoration: none;
        }

        .extra-links a:hover {
            text-decoration: underline;
        }

        #message {
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h3>Welcome To Smart Byte</h3>

    <form id="loginForm">

        <!-- Mobile -->
        <div class="input-group mb-4">
            <span class="input-group-text"><i class="fa fa-phone"></i></span>
            <input type="text" id="mobile" class="form-control" placeholder="Mobile Number">
        </div>

        <!-- Password -->
        <div class="input-group mb-4">
            <span class="input-group-text"><i class="fa fa-lock"></i></span>
            <input type="password" id="password" class="form-control" placeholder="Password">
            <span class="input-group-text toggle-password" id="togglePassword">
                <i class="fa fa-eye"></i>
            </span>
        </div>

        <!-- Button -->
        <button type="submit" class="btn btn-login w-100">Login</button>

        <div id="message" class="text-center mt-3"></div>

        <div class="extra-links">
            <a href="#">Forgot Password?</a>
        </div>

    </form>
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
$(document).ready(function () {

    // Toggle password
    $('#togglePassword').click(function () {
        let passwordField = $('#password');
        let type = passwordField.attr('type') === 'password' ? 'text' : 'password';
        passwordField.attr('type', type);

        $(this).find('i').toggleClass('fa-eye fa-eye-slash');
    });

    // Form submit
    $('#loginForm').submit(function (e) {
        e.preventDefault();

        let mobile = $('#mobile').val().trim();
        let password = $('#password').val().trim();

        if (mobile === '' || password === '') {
            $('#message').html('<span class="text-warning">All fields are required</span>');
            return;
        }

        if (!/^[0-9]{10}$/.test(mobile)) {
            $('#message').html('<span class="text-warning">Enter valid 10-digit mobile</span>');
            return;
        }


        $.ajax({
            url: 'http://localhost:3000/api/login',  // your API
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({
                mobile: mobile,
                password: password
            }),
            success: function (res) {
                if(res.success){
                     localStorage.setItem('token', res.token);

                    alert('Login successful');
                    debugger;
                    let _UserId= res.user.userid;
                    const _UserRole=res.user.role;

                    if (_UserRole === 'Admin'){
                     window.location.href = "./pages/Admin.html";
                    }
                    else {
                        window.location.href =`./pages/StudentPage.html?userId=${_UserId}`;
                    }
                } else {
                    alert(res.message);
                }
            },
            error: function (err) {
                console.error('Error:', err);
                alert('Something went wrong');
            }
        });
    });

});
</script>

</body>
</html>
